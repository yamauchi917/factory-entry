<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>入退室</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; }
  body { background: #f3f4f6; color: #111; font-family: -apple-system, "Hiragino Sans", "Meiryo", sans-serif; overflow: hidden; }
  .screen { display: none; position: fixed; inset: 0; padding: 20px 24px; flex-direction: column; }
  .screen.active { display: flex; }
  button { font-family: inherit; cursor: pointer; border: 0; border-radius: 16px; }
  button:active { transform: scale(0.97); }

  /* 最初の画面 */
  #clock { text-align: center; margin-top: 10px; }
  #clock .time { font-size: 72px; font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #clock .date { font-size: 24px; color: #555; }
  #homeBtns { flex: 1; display: flex; gap: 32px; align-items: center; justify-content: center; }
  .big { width: 38%; height: 52%; font-size: 64px; font-weight: bold; color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,.18); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .big small { font-size: 22px; font-weight: normal; opacity: .9; }
  .in-color { background: #1f6feb; }
  .out-color { background: #4b5563; }
  #home .in-color { background: linear-gradient(160deg, #3b82f6, #1d4ed8); }
  #home .out-color { background: linear-gradient(160deg, #6b7280, #374151); }
  #homeInfo { text-align: center; font-size: 22px; color: #333; }
  #netInfo { text-align: center; font-size: 16px; color: #b45309; min-height: 22px; margin-top: 4px; }

  /* 最初の画面：時間帯で背景が変わる */
  #home.morning { background: linear-gradient(180deg, #ffe7c2 0%, #fff6e6 45%, #e6f2ff 100%); }
  #home.day     { background: linear-gradient(180deg, #cfe8ff 0%, #eef7ff 55%, #f7fbff 100%); }
  #home.evening { background: linear-gradient(180deg, #ffc9a8 0%, #ffe3d1 50%, #f3e8ff 100%); }
  #home.night   { background: linear-gradient(180deg, #1e2a4a 0%, #2d3a63 60%, #3b4a7a 100%); }
  #home.night #clock .time, #home.night #greet, #home.night #homeInfo { color: #fff; }
  #home.night #clock .date { color: #cbd5e1; }
  #home.night #netInfo { color: #fcd34d; }
  #home.night #tip { background: rgba(255,255,255,.12); color: #e2e8f0; }
  #greet { text-align: center; font-size: 30px; font-weight: bold; margin-top: 6px; color: #1f2937; }
  #tip { margin: 10px auto 0; padding: 10px 22px; border-radius: 999px; background: rgba(255,255,255,.75); font-size: 20px; color: #374151; max-width: 90%; text-align: center; }

  /* 名前の一覧 */
  .bar { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
  .bar h1 { margin: 0; font-size: 34px; flex: 1; }
  .back { font-size: 24px; padding: 14px 28px; background: #d1d5db; color: #111; }
  .legend { font-size: 18px; color: #444; }
  .legend .o { color: #e67700; font-weight: bold; }
  #names { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; align-content: start; overflow-y: auto; padding-bottom: 12px; }
  .name { height: 72px; font-size: 26px; background: #fff; color: #111; border: 2px solid #d1d5db; font-weight: bold; }
  .name.in { color: #e67700; border-color: #f59f00; background: #fff7e6; }
  #listHead.in-mode { color: #1f6feb; }
  #listHead.out-mode { color: #374151; }

  /* 健康チェック（その日最初の打刻のときだけ） */
  #health { background: #f8fafc; }
  #healthBody { flex: 1; display: flex; gap: 16px; min-height: 0; }
  #tempBox { width: 250px; flex-shrink: 0; display: flex; flex-direction: column; }
  #tempBox .hlabel { font-size: 24px; font-weight: bold; }
  #tempShow { font-size: 56px; font-weight: bold; text-align: center; background: #fff; border: 3px solid #1f6feb; border-radius: 14px; padding: 4px 0; margin: 6px 0 10px; font-variant-numeric: tabular-nums; }
  #tempShow.empty { color: #9ca3af; }
  #tempPad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #tempPad button { height: 58px; font-size: 30px; font-weight: bold; background: #fff; border: 2px solid #d1d5db; color: #111; }
  #tempPad button.sub { font-size: 20px; background: #e5e7eb; }
  #items { flex: 1; display: flex; gap: 16px; overflow-y: auto; align-items: flex-start; }
  #items .col { flex: 1.9; }
  #items .col.house { flex: 1; }
  #items h2 { font-size: 20px; margin: 0 0 4px; }
  .hitem { display: flex; gap: 6px; align-items: center; min-height: 31px; padding: 2px 6px; font-size: 16px; line-height: 1.3; border-bottom: 1px solid #e5e7eb; }
  .hitem .mk { width: 28px; flex-shrink: 0; text-align: center; font-size: 22px; font-weight: bold; color: #16a34a; }
  #health.ng .hitem { background: #fff; border: 2px solid #d1d5db; border-radius: 8px; margin-bottom: 2px; cursor: pointer; }
  #health.ng .hitem.x { background: #fee2e2; border-color: #ef4444; }
  .hitem.x .mk { color: #dc2626; }
  #rules { margin-top: 12px; font-size: 14px; color: #4b5563; line-height: 1.5; }
  #healthMsg { text-align: center; font-size: 20px; font-weight: bold; color: #b91c1c; min-height: 28px; margin-top: 4px; }
  #healthBtns { display: flex; gap: 20px; justify-content: center; margin-top: 4px; }
  #healthBtns button { font-size: 24px; padding: 16px 30px; font-weight: bold; }
  @media (max-height: 800px) {   /* 小さめのiPadでも①〜⑬が一度に見えるように */
    #health { padding-top: 12px; padding-bottom: 12px; }
    #health .bar { margin-bottom: 6px; }
    #health .bar h1 { font-size: 28px; }
    #health .back { padding: 10px 24px; }
    #health .hitem { font-size: 15px; }
    #healthBtns button { padding: 12px 26px; }
  }

  /* 撮影 */
  #camTitle { font-size: 34px; font-weight: bold; text-align: center; margin: 0 0 8px; }
  #camWrap { position: relative; width: fit-content; max-width: 100%; margin: 0 auto; }
  #video { display: block; max-width: 100%; max-height: 62vh; border-radius: 16px; background: #000; transform: scaleX(-1); }
  #camFrame { position: absolute; inset: 0; border: 10px solid #9ca3af; border-radius: 16px; pointer-events: none; transition: border-color .15s; }
  #camFrame.ok { border-color: #22c55e; }
  #camMsg { text-align: center; font-size: 32px; font-weight: bold; margin-top: 10px; min-height: 44px; }
  #progress { height: 12px; background: #d1d5db; border-radius: 6px; overflow: hidden; width: 60%; margin: 8px auto 0; }
  #progressIn { height: 100%; width: 0; background: #22c55e; }
  #camBtns { display: flex; justify-content: center; gap: 20px; margin-top: 12px; }
  #manualBtn { font-size: 26px; padding: 16px 36px; background: #1f6feb; color: #fff; }

  /* 完了 */
  #done { align-items: center; justify-content: center; text-align: center; overflow: hidden; }
  #done.in  { background: linear-gradient(180deg, #fff7e0, #ffffff 60%); }
  #done.out { background: linear-gradient(180deg, #e8ecf8, #ffffff 60%); }
  #doneIcon { font-size: 90px; line-height: 1; animation: pop .5s ease-out; }
  #doneName { font-size: 52px; font-weight: bold; margin-top: 8px; }
  #doneType { font-size: 64px; font-weight: bold; margin-top: 6px; }
  #doneMsg  { font-size: 32px; margin-top: 14px; color: #374151; }
  #doneBadge { display: inline-block; margin-top: 18px; padding: 8px 24px; border-radius: 999px; font-size: 26px; font-weight: bold; background: #fff3c4; color: #92400e; }
  #doneBadge:empty { display: none; }
  #done.out #doneBadge { background: #e0e7ff; color: #3730a3; }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
  .confetti { position: absolute; top: -30px; width: 12px; height: 18px; border-radius: 3px; animation: fall linear forwards; pointer-events: none; }
  .confetti.star { width: auto; height: auto; background: none; font-size: 26px; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } #doneIcon { animation: none; } }

  /* お知らせ（すでに入室中です 等） */
  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); align-items: center; justify-content: center; z-index: 10; }
  #modal.show { display: flex; }
  #modalBox { background: #fff; border-radius: 20px; padding: 36px 44px; max-width: 80%; text-align: center; }
  #modalText { font-size: 32px; font-weight: bold; line-height: 1.5; white-space: pre-line; }
  #modalBtns { display: flex; gap: 20px; justify-content: center; margin-top: 24px; }
  #modalBtns button { font-size: 26px; padding: 16px 36px; }

  /* 設定 */
  #setup { overflow-y: auto; }
  #setup label { display: block; font-size: 20px; margin: 16px 0 6px; }
  #setup input { width: 100%; font-size: 18px; padding: 12px; border: 1px solid #9ca3af; border-radius: 10px; -webkit-user-select: text; user-select: text; }
  #setup .row { display: flex; gap: 16px; margin-top: 20px; }
  #setup .row button { font-size: 22px; padding: 14px 28px; }
  #setupMsg { font-size: 20px; margin-top: 16px; white-space: pre-line; }
</style>
</head>
<body>

<!-- 最初の画面 -->
<section id="home" class="screen">
  <div id="clock"><div class="time" id="time">--:--</div><div class="date" id="date"></div></div>
  <div id="greet"></div>
  <div id="tip"></div>
  <div id="homeBtns">
    <button class="big in-color" id="inBtn">入室</button>
    <button class="big out-color" id="outBtn">退室</button>
  </div>
  <div id="homeInfo"></div>
  <div id="netInfo"></div>
</section>

<!-- 名前の一覧 -->
<section id="list" class="screen">
  <div class="bar">
    <h1 id="listHead"></h1>
    <span class="legend"><span class="o">オレンジ</span>＝入室中　黒＝退室済み</span>
    <button class="back" id="listBack">戻る</button>
  </div>
  <div id="names"></div>
</section>

<!-- 健康チェック（その日最初の打刻のときだけ） -->
<section id="health" class="screen">
  <div class="bar">
    <h1 id="healthHead"></h1>
    <button class="back" id="healthBack">やめる</button>
  </div>
  <div id="healthBody">
    <div id="tempBox">
      <div class="hlabel">体温を入力</div>
      <div id="tempShow"></div>
      <div id="tempPad"></div>
    </div>
    <div id="items">
      <div class="col"><h2>ご本人</h2><div id="selfItems"></div></div>
      <div class="col house"><h2>同居の方</h2><div id="houseItems"></div><div id="rules"></div></div>
    </div>
  </div>
  <div id="healthMsg"></div>
  <div id="healthBtns">
    <button id="allOkBtn" class="in-color" style="color:#fff">すべて当てはまる（全部○）→ 撮影へ</button>
    <button id="someNgBtn" class="back">当てはまらないものがある</button>
    <button id="ngDoneBtn" class="in-color" style="color:#fff;display:none">この内容で記録 → 撮影へ</button>
    <button id="ngBackBtn" class="back" style="display:none">全部○に戻す</button>
  </div>
</section>

<!-- 撮影 -->
<section id="cam" class="screen">
  <div id="camTitle"></div>
  <div id="camWrap"><video id="video" autoplay playsinline muted></video><div id="camFrame"></div></div>
  <div id="camMsg"></div>
  <div id="progress"><div id="progressIn"></div></div>
  <div id="camBtns">
    <button id="manualBtn" style="display:none">撮影する</button>
    <button class="back" id="camBack">やめる</button>
  </div>
</section>

<!-- 完了 -->
<section id="done" class="screen">
  <div id="doneIcon"></div>
  <div id="doneName"></div>
  <div id="doneType"></div>
  <div id="doneMsg"></div>
  <div><span id="doneBadge"></span></div>
</section>

<!-- 設定（時計を5回続けてタップすると開く） -->
<section id="setup" class="screen">
  <h1 style="margin:0">設定</h1>
  <label for="gasUrl">GASのウェブアプリのURL</label>
  <input id="gasUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
  <label for="gasToken">合言葉（トークン）</label>
  <input id="gasToken" type="text" autocomplete="off">
  <div class="row">
    <button id="setupSave" class="in-color" style="color:#fff">保存して接続を確認</button>
    <button id="setupClose" class="back">閉じる</button>
  </div>
  <div id="setupMsg"></div>
</section>

<div id="modal"><div id="modalBox"><div id="modalText"></div><div id="modalBtns"></div></div></div>

<script type="module">
import { FaceLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ================================================================ 設定値
const CFG = {
  yawCenter: -5,        // 左右の向きの中心（カメラが画面の左にあるため少しずれる）
  yawTol: 15,           // 左右の許容（±度）
  pitchCenter: 0,       // 上下の向きの中心
  pitchTol: 20,         // 上下の許容（±度）
  minSize: 20,          // 顔の最小サイズ（映像の横幅に対する%）
  holdMs: 600,          // 正面をこの時間続けたら撮影
  manualAfterMs: 6000,  // この時間で撮れなければ「撮影する」ボタンを出す
  doneMs: 3500,         // 完了画面を表示する時間
  idleMs: 30000,        // 一覧・撮影画面で操作がなければ最初の画面へ戻る
  healthIdleMs: 90000,  // 健康チェックの画面は読む時間があるので長めに
  feverTemp: 37.5,      // この体温以上は「上司に報告」（GASの FEVER_TEMP と合わせる）
  refreshMs: 60000,     // 一覧をGoogleから読み直す間隔
  retryMs: 15000,       // 送れなかった記録を再送する間隔
  photoSize: 640,       // 写真の長い辺（px）
};

const $ = id => document.getElementById(id);

// ================================================================ 端末内の保存（失敗しても動くように）
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};

let gasUrl = store.get("gasUrl", "");
let token = store.get("gasToken", "");
let employees = store.get("employees", []);   // [{id, name, kana, status:'in'|'out'}]
let queue = store.get("queue", []);           // 未送信の記録
let netError = "";
let netDetail = "";   // 原因調査用の詳しい内容

// 設定用リンク（#gas=...&token=...）で開かれたら、設定を保存してリンクを消す
(function readSetupLink() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("gas") && p.get("token")) {
    gasUrl = p.get("gas"); token = p.get("token");
    store.set("gasUrl", gasUrl); store.set("gasToken", token);
    history.replaceState(null, "", location.pathname);
  }
})();

// ================================================================ 画面の切り替え
let idleTimer = null;
const idleMsFor = id => id === "health" ? CFG.healthIdleMs : id === "list" || id === "cam" ? CFG.idleMs : 0;
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  clearTimeout(idleTimer);
  if (idleMsFor(id)) idleTimer = setTimeout(goHome, idleMsFor(id));
}
function touchIdle() {
  const active = document.querySelector(".screen.active");
  if (active && idleMsFor(active.id)) {
    clearTimeout(idleTimer); idleTimer = setTimeout(goHome, idleMsFor(active.id));
  }
}
document.addEventListener("pointerdown", touchIdle);

function goHome() {
  stopCapture();
  hideModal();
  renderHome();
  show("home");
}

function modal(text, buttons = [], autoCloseMs = 0) {
  $("modalText").textContent = text;
  const box = $("modalBtns"); box.innerHTML = "";
  for (const b of buttons) {
    const el = document.createElement("button");
    el.textContent = b.label; el.className = b.cls || "back";
    if (b.cls === "in-color" || b.cls === "out-color") el.style.color = "#fff";
    el.onclick = () => { hideModal(); b.onClick && b.onClick(); };
    box.appendChild(el);
  }
  $("modal").classList.add("show");
  if (autoCloseMs) setTimeout(hideModal, autoCloseMs);
}
function hideModal() { $("modal").classList.remove("show"); }

// ================================================================ 最初の画面
// 前向きな気分になれるように：時間帯のあいさつ・今日のひとこと・完了時のメッセージ
const TIPS = [
  "手洗いは、指先・爪のあいだまでていねいに 🧼",
  "あいさつは、元気のはじまり 👋",
  "今日の一品が、だれかの笑顔になります 🍱",
  "ヒヤリ・ハットは宝もの。気づいたら教えてください 💡",
  "こまめな水分補給を忘れずに 💧",
  "整理・整頓・清掃・清潔・しつけ 🧹",
  "困ったときは、まわりに声をかけよう 🤝",
  "小さな気づきが、大きな安心につながります 🔍",
  "昨日より、ちょっとだけ上手に 🌱",
  "ありがとうを、言葉にしよう 🙌",
  "確認は、指さし・声出しで 🎯",
  "休けいは、しっかり休むのも仕事のうち ☕",
];
const IN_MSGS = ["今日もよろしくお願いします！", "いい一日になりますように", "今日も安全第一で！", "笑顔でいきましょう！", "無理せず、いきましょう", "チームワークで乗り切ろう！", "おいしいものを届けましょう"];
const OUT_MSGS = ["ありがとうございました", "ひと息ついてくださいね", "水分補給も忘れずに", "いつもありがとうございます", "よくがんばりました！"];
const pick = a => a[Math.floor(Math.random() * a.length)];
const ymd = d => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;   // GASの healthDate と同じ形

function timeZone(h) { return h >= 5 && h < 10 ? "morning" : h >= 10 && h < 16 ? "day" : h >= 16 && h < 19 ? "evening" : "night"; }
const HELLO = { morning: "おはようございます！", day: "こんにちは！", evening: "こんばんは！", night: "こんばんは！" };
function greeting(d) {
  const z = timeZone(d.getHours());
  const icon = { morning: "☀️", day: "🌤", evening: "🌇", night: "🌙" }[z];
  const wd = d.getDay();
  const extra = wd === 1 ? "新しい一週間のはじまりです" : wd === 5 ? "金曜日！あと少しです" : wd === 0 || wd === 6 ? "休日出勤、ありがとうございます" : "今日もご安全に";
  return `${HELLO[z]}${extra} ${icon}`;
}

function tick() {
  const d = new Date();
  $("time").textContent = d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = d.toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
  const z = timeZone(d.getHours());
  if (!$("home").classList.contains(z)) {
    $("home").classList.remove("morning", "day", "evening", "night");
    $("home").classList.add(z);
  }
  $("greet").textContent = greeting(d);
  // ひとことは1日ごとに変わる
  const n = Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(2026, 0, 1)) / 86400000);
  $("tip").textContent = TIPS[((n % TIPS.length) + TIPS.length) % TIPS.length];
}

// 今日の入室の順番と入室時刻（この端末で記録したもの。日付が変わったらリセット）
function todayLog() {
  const t = store.get("today", null);
  return t && t.date === ymd(new Date()) ? t : { date: ymd(new Date()), count: 0, inAt: {} };
}

function confetti(type) {
  const box = $("done");
  box.querySelectorAll(".confetti").forEach(c => c.remove());
  const colors = ["#f59f00", "#3b82f6", "#22c55e", "#ef4444", "#a855f7", "#ec4899"];
  for (let i = 0; i < (type === "in" ? 40 : 14); i++) {
    const c = document.createElement("div");
    c.className = "confetti" + (type === "in" ? "" : " star");
    if (type === "in") c.style.background = colors[i % colors.length];
    else c.textContent = pick(["⭐", "✨", "🌙"]);
    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDuration = (type === "in" ? 1.8 : 3) + Math.random() * 1.5 + "s";
    c.style.animationDelay = Math.random() * 0.4 + "s";
    box.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

function showDone(emp, type) {
  const now = new Date();
  const t = todayLog();
  let badge = "";
  if (type === "in") {
    if (!t.inAt[emp.id]) { t.count++; badge = t.count === 1 ? "今日の一番乗り！ 🏆" : `今日 ${t.count}人目`; }
    t.inAt[emp.id] = now.toISOString();
  }
  store.set("today", t);

  $("done").className = "screen " + type;
  $("doneIcon").textContent = type === "in" ? pick(["💪", "✨", "🌟", "🙌"]) : pick(["🍵", "🌙", "👏", "🎉"]);
  $("doneName").textContent = `${emp.name} さん`;
  $("doneType").textContent = type === "in" ? HELLO[timeZone(now.getHours())] : "おつかれさまです！";
  $("doneType").style.color = type === "in" ? "#1d4ed8" : "#374151";
  $("doneMsg").textContent = (type === "in" ? "入室を記録しました。" : "退室を記録しました。") + pick(type === "in" ? IN_MSGS : OUT_MSGS);
  $("doneBadge").textContent = badge;
  show("done");
  confetti(type);
}
setInterval(tick, 1000); tick();

function renderHome() {
  const n = employees.filter(e => e.status === "in").length;
  $("homeInfo").textContent = employees.length ? `現在 入室中：${n}人` : "";
  const msgs = [];
  if (!gasUrl || !token) msgs.push("設定が済んでいません（時計を5回タップして設定）");
  if (netError) msgs.push(netError + (netDetail ? "（" + netDetail + "）" : ""));
  if (queue.length) msgs.push(`未送信の記録：${queue.length}件（自動で再送します）`);
  $("netInfo").textContent = msgs.join("　／　");
}

// 時計を5回続けてタップ → 設定画面
let taps = [];
$("clock").addEventListener("click", () => {
  const now = Date.now();
  taps = taps.filter(t => now - t < 3000); taps.push(now);
  if (taps.length >= 5) { taps = []; openSetup(); }
});

$("inBtn").onclick = () => openList("in");
$("outBtn").onclick = () => openList("out");

// ================================================================ 名前の一覧
let mode = "in";
async function openList(m) {
  mode = m;
  requestWakeLock();
  if (!employees.length) {
    if (!gasUrl || !token) { modal("設定が済んでいません。", [{ label: "閉じる" }]); return; }
    await refreshEmployees();
    if (!employees.length) {
      modal(netError
        ? `従業員の一覧を読み込めません。\n（${netError}${netDetail ? "：" + netDetail : ""}）`
        : "従業員が登録されていません。\nスプレッドシートの「従業員」シートに\n入力してください。",
        [{ label: "閉じる" }]);
      return;
    }
  }
  $("listHead").textContent = m === "in" ? "入室：自分の名前をタップ" : "退室：自分の名前をタップ";
  $("listHead").className = m === "in" ? "in-mode" : "out-mode";
  renderNames();
  show("list");
  refreshEmployees().then(() => { if ($("list").classList.contains("active")) renderNames(); });
}

function renderNames() {
  const box = $("names"); box.innerHTML = "";
  for (const e of employees) {
    const b = document.createElement("button");
    b.className = "name" + (e.status === "in" ? " in" : "");
    b.textContent = e.name;
    b.onclick = () => pickName(e);
    box.appendChild(b);
  }
}

function pickName(e) {
  // 前回の退室を押し忘れている（入室中のまま）
  if (mode === "in" && e.status === "in") {
    modal(`${e.name} さんは\n退室の記録がありませんが、\n入室を記録しますか？`, [
      { label: "記録する", cls: "in-color", onClick: () => proceed(e, "in", "退室記録なし") },
      { label: "やめる" },
    ]);
    return;
  }
  // 入室を押し忘れている
  if (mode === "out" && e.status !== "in") {
    modal(`${e.name} さんは\n入室の記録がありませんが、\n退室を記録しますか？`, [
      { label: "記録する", cls: "out-color", onClick: () => proceed(e, "out", "入室記録なし") },
      { label: "やめる" },
    ]);
    return;
  }
  proceed(e, mode, "");
}

// 今日まだ健康チェックをしていなければ、撮影の前に健康チェック
function proceed(e, type, note) {
  if (e.healthDate !== dayKey(new Date())) openHealth(e, type, note);
  else startCapture(e, type, note, null);
}

$("listBack").onclick = goHome;

// ================================================================ 健康チェック（従事者個人別健康観察記録票）
const SELF_ITEMS = [
  "①下痢をしていない",
  "②発熱していない",
  "③腹痛をしていない",
  "④嘔吐していない",
  "⑤感染症の感染、疑いはない（耳や目、鼻から病的な分泌物はない）",
  "⑥手指、腕、顔面に傷、発疹、化膿創はない",
  "⑦健康診断、検便検査に異常はない",
  "⑧調理衣、マスク、帽子は専用の清潔なものと交換している",
  "⑨爪は短く切り、マニキュアはしていない",
  "⑩指輪、ネックレス、ピアス、ヘアピン、時計等はしていない",
  "⑪過度の化粧、つけまつ毛等剥離の恐れがあるものは身につけていない",
  "⑫作業に不必要な物品は工場内に持ち込んでいない",
  "⑬工場入室前にローラー掛け、手洗いを行った",
];
const HOUSE_ITEMS = [
  "①下痢をしていない",
  "②発熱していない",
  "③腹痛をしていない",
  "④嘔吐していない",
  "⑤感染症の感染、疑いはない",
];
const WOUND = 5;   // ⑥（化膿創）の位置：×なら調理作業は禁止
const RULES = [
  "★項目で異常があった場合は、速やかに上司に報告し指示を仰ぐこと。",
  "★化膿性疾患のある場合は調理作業に従事することを禁止する。",
];

let hc = null;   // 入力中の健康チェック {emp, type, note, digits, marks, ng}

function openHealth(emp, type, note) {
  hc = { emp, type, note, digits: "", marks: Array(SELF_ITEMS.length + HOUSE_ITEMS.length).fill(""), ng: false };
  $("healthHead").textContent = `${emp.name} さん　今日の健康チェック`;
  $("rules").innerHTML = RULES.map(t => `<div>${t}</div>`).join("");
  renderHealth();
  show("health");
}

function renderHealth() {
  const d = hc.digits;
  $("tempShow").textContent = d.length === 3 ? `${d[0]}${d[1]}.${d[2]} ℃` : d.length ? `${d.padEnd(3, "_").replace(/^(..)(.)$/, "$1.$2")} ℃` : "--.- ℃";
  $("tempShow").classList.toggle("empty", !d);
  $("health").classList.toggle("ng", hc.ng);
  const fill = (box, items, offset) => {
    box.innerHTML = "";
    items.forEach((t, i) => {
      const k = offset + i;
      const row = document.createElement("div");
      row.className = "hitem" + (hc.marks[k] === "×" ? " x" : "");
      row.innerHTML = `<span class="mk">${hc.marks[k]}</span><span></span>`;
      row.lastChild.textContent = t;
      row.onclick = () => { if (!hc.ng) return; hc.marks[k] = hc.marks[k] === "×" ? "○" : "×"; renderHealth(); };
      box.appendChild(row);
    });
  };
  fill($("selfItems"), SELF_ITEMS, 0);
  fill($("houseItems"), HOUSE_ITEMS, SELF_ITEMS.length);
  $("allOkBtn").style.display = $("someNgBtn").style.display = hc.ng ? "none" : "";
  $("ngDoneBtn").style.display = $("ngBackBtn").style.display = hc.ng ? "" : "none";
  $("healthMsg").textContent = hc.ng ? "当てはまらない項目をタップして ×（赤）にしてください" : "";
}

// 体温のテンキー（3けた入れると 36.4 のように表示）
(function buildTempPad() {
  for (const k of ["1", "2", "3", "4", "5", "6", "7", "8", "9", "消す", "0", "←"]) {
    const b = document.createElement("button");
    b.textContent = k;
    if (k.length > 1 || k === "←") b.className = "sub";
    b.onclick = () => {
      if (k === "消す") hc.digits = "";
      else if (k === "←") hc.digits = hc.digits.slice(0, -1);
      else if (hc.digits.length < 3) hc.digits += k;
      renderHealth();
    };
    $("tempPad").appendChild(b);
  }
})();

function readTemp() {
  if (hc.digits.length !== 3) return null;
  const t = Number(hc.digits) / 10;
  return t >= 34 && t <= 42 ? t : NaN;
}

function finishHealth(allOk) {
  const temp = readTemp();
  if (temp === null) { $("healthMsg").textContent = "体温を入力してください（例：36.4 → 3・6・4）"; return; }
  if (isNaN(temp)) { $("healthMsg").textContent = "体温をもう一度確かめてください"; return; }
  const marks = allOk ? hc.marks.map(() => "○") : hc.marks.map(m => m || "○");
  const health = { temp, marks };
  const { emp, type, note } = hc;
  const go = () => startCapture(emp, type, note, health);
  if (marks.includes("×") || temp >= CFG.feverTemp) {
    let text = "上司に報告し、\n指示を受けてください。";
    if (marks[WOUND] === "×") text += "\n\n手指・腕・顔面に傷や化膿創がある場合は、\n調理作業はできません。";
    modal(text, [{ label: "わかりました（撮影へ）", cls: "in-color", onClick: go }]);
    return;
  }
  go();
}

$("allOkBtn").onclick = () => finishHealth(true);
$("someNgBtn").onclick = () => { hc.ng = true; hc.marks = hc.marks.map(() => "○"); renderHealth(); };
$("ngDoneBtn").onclick = () => finishHealth(false);
$("ngBackBtn").onclick = () => { hc.ng = false; hc.marks = hc.marks.map(() => ""); renderHealth(); };
$("healthBack").onclick = goHome;

// ================================================================ 顔の向きの判定
let landmarker = null;
async function initFace() {
  try {
    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const opts = delegate => ({
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate,
      },
      runningMode: "VIDEO",
      numFaces: 1,
      minFaceDetectionConfidence: 0.3,
      minFacePresenceConfidence: 0.3,
      minTrackingConfidence: 0.3,
      outputFacialTransformationMatrixes: true,
    });
    try { landmarker = await FaceLandmarker.createFromOptions(fileset, opts("GPU")); }
    catch { landmarker = await FaceLandmarker.createFromOptions(fileset, opts("CPU")); }
  } catch (err) {
    console.error("顔判定を読み込めません", err);
  }
}

function faceAngles(m) {
  const r = (i, j) => m[j * 4 + i];
  const deg = 180 / Math.PI;
  return {
    yaw: Math.asin(Math.max(-1, Math.min(1, -r(2, 0)))) * deg,
    pitch: Math.atan2(r(2, 1), r(2, 2)) * deg,
  };
}

// ================================================================ 撮影
const video = $("video");
let stream = null;
let cap = null;   // 撮影中の情報 {emp, type, note, health, startedAt, okSince, running}

async function startCapture(emp, type, note, health) {
  const my = cap = { emp, type, note, health, startedAt: performance.now(), okSince: 0, running: true, lastTime: -1 };
  $("camTitle").textContent = `${emp.name} さん（${type === "in" ? "入室" : "退室"}）`;
  $("camTitle").style.color = type === "in" ? "#1f6feb" : "#374151";
  $("manualBtn").style.display = "none";
  $("progressIn").style.width = "0";
  setCamMsg("カメラを起動しています…", false);
  show("cam");
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
    });
    if (cap !== my) { s.getTracks().forEach(t => t.stop()); return; }   // 起動中に「やめる」が押された
    stream = s;
    video.srcObject = stream;
    await video.play();
  } catch (err) {
    if (cap !== my) return;
    console.error(err);
    stopCapture();
    modal("カメラを使えません（" + err.name + "）。\niPadの設定でカメラを許可してください。", [{ label: "閉じる", onClick: goHome }]);
    return;
  }
  if (cap !== my) return;
  setCamMsg(landmarker ? "カメラの方を向いてください" : "顔判定の準備中…", false);
  requestAnimationFrame(camLoop);
}

function setCamMsg(text, ok) {
  $("camMsg").textContent = text;
  $("camFrame").classList.toggle("ok", !!ok);
}

function camLoop() {
  if (!cap || !cap.running) return;
  const now = performance.now();
  if (landmarker && video.readyState >= 2 && video.currentTime !== cap.lastTime) {
    cap.lastTime = video.currentTime;
    judge(landmarker.detectForVideo(video, now), now);
  }
  if (cap && cap.running && now - cap.startedAt > CFG.manualAfterMs) $("manualBtn").style.display = "";
  if (cap && cap.running) requestAnimationFrame(camLoop);
}

function judge(res, now) {
  let ok = false, msg = "顔が見つかりません";
  if (res.faceLandmarks && res.faceLandmarks.length) {
    const xs = res.faceLandmarks[0].map(p => p.x);
    const size = (Math.max(...xs) - Math.min(...xs)) * 100;
    const { yaw, pitch } = faceAngles(res.facialTransformationMatrixes[0].data);
    if (size < CFG.minSize) msg = "もう少し近づいてください";
    else if (Math.abs(yaw - CFG.yawCenter) > CFG.yawTol || Math.abs(pitch - CFG.pitchCenter) > CFG.pitchTol) msg = "カメラの方を向いてください";
    else { ok = true; msg = "そのまま…"; }
  }
  if (ok) {
    if (!cap.okSince) cap.okSince = now;
    const p = Math.min(1, (now - cap.okSince) / CFG.holdMs);
    $("progressIn").style.width = p * 100 + "%";
    setCamMsg(msg, true);
    if (p >= 1) takePhoto("自動");
  } else {
    cap.okSince = 0;
    $("progressIn").style.width = "0";
    setCamMsg(msg, false);
  }
}

function takePhoto(method) {
  if (!cap || !cap.running || !video.videoWidth) return;
  cap.running = false;
  const scale = CFG.photoSize / Math.max(video.videoWidth, video.videoHeight);
  const c = document.createElement("canvas");
  c.width = Math.round(video.videoWidth * scale);
  c.height = Math.round(video.videoHeight * scale);
  c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
  const photo = c.toDataURL("image/jpeg", 0.7);
  const { emp, type, note, health } = cap;
  stopCapture();
  record(emp, type, method, note, photo, health);
}

function stopCapture() {
  cap = null;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
}

$("manualBtn").onclick = () => takePhoto("手動");
$("camBack").onclick = goHome;

// ================================================================ 記録（先に画面を進め、送信は裏で行う）
function record(emp, type, method, note, photo, health) {
  const item = {
    qid: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    id: emp.id, type, method, note, photo, time: new Date().toISOString(),
  };
  if (health) item.health = health;
  queue.push(item);
  if (!store.set("queue", queue)) {
    // 端末の保存容量が足りない時は写真を外して保存（記録だけは残す）
    store.set("queue", queue.map(q => ({ ...q, photo: q === item ? "" : q.photo })));
  }
  const e = employees.find(x => x.id === emp.id);
  if (e) { e.status = type; if (health) e.healthDate = dayKey(new Date(item.time)); }
  store.set("employees", employees);

  showDone(emp, type);
  setTimeout(() => { if ($("done").classList.contains("active")) goHome(); }, CFG.doneMs);
  sendQueue();
}

// ================================================================ Googleとの通信
async function api(body) {
  // Safariは開いた直後などに一時的に失敗（Load failed）することがあるので、少し待って2回までやり直す
  let res;
  for (let i = 0; ; i++) {
    try {
      res = await fetch(gasUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },   // この形式だとGASに直接送れる
        body: JSON.stringify({ ...body, token }),
      });
      break;
    } catch (err) {
      if (i >= 2) throw err;
      await new Promise(r => setTimeout(r, 1500 * (i + 1)));
    }
  }
  const text = await res.text();
  try { return JSON.parse(text); }
  catch {
    // JSONでない＝Googleのログイン画面などが返ってきている
    throw new Error(/accounts\.google|ログイン|Sign in/i.test(text)
      ? "Googleのログイン画面が返りました（デプロイの「アクセスできるユーザー」を確認）"
      : `想定外の応答（${res.status}）`);
  }
}

let sending = false;
async function sendQueue() {
  if (sending || !queue.length || !gasUrl || !token) { renderHome(); return; }
  sending = true;
  try {
    while (queue.length) {
      const item = queue[0];
      let res;
      try { res = await api({ action: "punch", ...item }); }
      catch { netError = "Googleに接続できません"; break; }
      if (res.ok || res.code === "unknown_employee" || res.code === "bad_request") {
        if (!res.ok) console.warn("記録できなかったため破棄しました", res, item);
        queue.shift();
        store.set("queue", queue);
        netError = "";
      } else {
        netError = res.code === "auth" ? "合言葉（トークン）が違います" : "Google側でエラーが起きました";
        break;
      }
    }
  } finally {
    sending = false;
    renderHome();
  }
}

async function refreshEmployees() {
  if (!gasUrl || !token) { renderHome(); return; }
  try {
    const res = await api({ action: "list" });
    if (!res.ok) { netError = res.code === "auth" ? "合言葉（トークン）が違います" : "Google側でエラーが起きました"; netDetail = res.error || ""; return; }
    // ふりがなのあいうえお順（カタカナ・半角カナもひらがなとして並べる）
    const yomi = e => (e.kana || e.name).normalize("NFKC").replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
    employees = res.employees.sort((a, b) => yomi(a).localeCompare(yomi(b), "ja"));
    // まだ送れていない記録の分を反映
    for (const q of queue) {
      const e = employees.find(x => x.id === q.id);
      if (e) { e.status = q.type; if (q.health) e.healthDate = dayKey(new Date(q.time)); }
    }
    store.set("employees", employees);
    netError = ""; netDetail = "";
  } catch (err) {
    netError = "Googleに接続できません";
    netDetail = err.message || String(err);
  } finally {
    renderHome();
  }
}

// ================================================================ 設定画面
function openSetup() {
  $("gasUrl").value = gasUrl;
  $("gasToken").value = token;
  $("setupMsg").textContent = "";
  show("setup");
}
$("setupClose").onclick = goHome;
$("setupSave").onclick = async () => {
  gasUrl = $("gasUrl").value.trim();
  token = $("gasToken").value.trim();
  store.set("gasUrl", gasUrl); store.set("gasToken", token);
  $("setupMsg").textContent = "接続を確認しています…";
  await refreshEmployees();
  $("setupMsg").textContent = netError
    ? "接続できませんでした：" + netError
    : `接続できました。従業員 ${employees.length}人を読み込みました。`;
};

// ================================================================ 画面を消さない（対応しているiPadのみ）
let wakeLock = null;
async function requestWakeLock() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch {}
}

// ================================================================ 起動
renderHome();
show(gasUrl && token ? "home" : "setup");
if (!(gasUrl && token)) $("setupMsg").textContent = "最初に、GASのURLと合言葉を設定してください。";
initFace();
refreshEmployees().then(sendQueue);
setInterval(() => { if ($("home").classList.contains("active")) refreshEmployees(); }, CFG.refreshMs);
setInterval(sendQueue, CFG.retryMs);
// 画面を開き直したとき・ほかのアプリから戻ったときは、すぐにつなぎ直す
function reconnect() { if (document.visibilityState === "visible" && gasUrl && token) refreshEmployees().then(sendQueue); }
document.addEventListener("visibilitychange", reconnect);
window.addEventListener("pageshow", e => { if (e.persisted) reconnect(); });
window.addEventListener("online", sendQueue);
</script>
