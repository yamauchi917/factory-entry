<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>入退室</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; }
  body { background: #f3f4f6; color: #111; font-family: -apple-system, "Hiragino Sans", "Meiryo", sans-serif; overflow: hidden; }
  .screen { display: none; position: fixed; inset: 0; padding: 20px 24px; flex-direction: column; }
  .screen.active { display: flex; }
  button { font-family: inherit; cursor: pointer; border: 0; border-radius: 16px; }
  button:active { transform: scale(0.97); }

  /* 最初の画面 */
  #clock { text-align: center; margin-top: 10px; }
  #clock .time { font-size: 72px; font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #clock .date { font-size: 24px; color: #555; }
  #homeBtns { flex: 1; display: flex; gap: 32px; align-items: center; justify-content: center; }
  .big { width: 38%; height: 52%; font-size: 64px; font-weight: bold; color: #fff; box-shadow: 0 6px 16px rgba(0,0,0,.15); }
  .in-color { background: #1f6feb; }
  .out-color { background: #4b5563; }
  #homeInfo { text-align: center; font-size: 22px; color: #333; }
  #netInfo { text-align: center; font-size: 16px; color: #b45309; min-height: 22px; margin-top: 4px; }

  /* 名前の一覧 */
  .bar { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
  .bar h1 { margin: 0; font-size: 34px; flex: 1; }
  .back { font-size: 24px; padding: 14px 28px; background: #d1d5db; color: #111; }
  .legend { font-size: 18px; color: #444; }
  .legend .o { color: #e67700; font-weight: bold; }
  #names { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; align-content: start; overflow-y: auto; padding-bottom: 12px; }
  .name { height: 72px; font-size: 26px; background: #fff; color: #111; border: 2px solid #d1d5db; font-weight: bold; }
  .name.in { color: #e67700; border-color: #f59f00; background: #fff7e6; }
  #listHead.in-mode { color: #1f6feb; }
  #listHead.out-mode { color: #374151; }

  /* 撮影 */
  #camTitle { font-size: 34px; font-weight: bold; text-align: center; margin: 0 0 8px; }
  #camWrap { position: relative; width: fit-content; max-width: 100%; margin: 0 auto; }
  #video { display: block; max-width: 100%; max-height: 62vh; border-radius: 16px; background: #000; transform: scaleX(-1); }
  #camFrame { position: absolute; inset: 0; border: 10px solid #9ca3af; border-radius: 16px; pointer-events: none; transition: border-color .15s; }
  #camFrame.ok { border-color: #22c55e; }
  #camMsg { text-align: center; font-size: 32px; font-weight: bold; margin-top: 10px; min-height: 44px; }
  #progress { height: 12px; background: #d1d5db; border-radius: 6px; overflow: hidden; width: 60%; margin: 8px auto 0; }
  #progressIn { height: 100%; width: 0; background: #22c55e; }
  #camBtns { display: flex; justify-content: center; gap: 20px; margin-top: 12px; }
  #manualBtn { font-size: 26px; padding: 16px 36px; background: #1f6feb; color: #fff; }

  /* 完了 */
  #done { align-items: center; justify-content: center; text-align: center; }
  #doneName { font-size: 56px; font-weight: bold; }
  #doneType { font-size: 72px; font-weight: bold; margin-top: 12px; }

  /* お知らせ（すでに入室中です 等） */
  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); align-items: center; justify-content: center; z-index: 10; }
  #modal.show { display: flex; }
  #modalBox { background: #fff; border-radius: 20px; padding: 36px 44px; max-width: 80%; text-align: center; }
  #modalText { font-size: 32px; font-weight: bold; line-height: 1.5; white-space: pre-line; }
  #modalBtns { display: flex; gap: 20px; justify-content: center; margin-top: 24px; }
  #modalBtns button { font-size: 26px; padding: 16px 36px; }

  /* 設定 */
  #setup { overflow-y: auto; }
  #setup label { display: block; font-size: 20px; margin: 16px 0 6px; }
  #setup input { width: 100%; font-size: 18px; padding: 12px; border: 1px solid #9ca3af; border-radius: 10px; -webkit-user-select: text; user-select: text; }
  #setup .row { display: flex; gap: 16px; margin-top: 20px; }
  #setup .row button { font-size: 22px; padding: 14px 28px; }
  #setupMsg { font-size: 20px; margin-top: 16px; white-space: pre-line; }
</style>
</head>
<body>

<!-- 最初の画面 -->
<section id="home" class="screen">
  <div id="clock"><div class="time" id="time">--:--</div><div class="date" id="date"></div></div>
  <div id="homeBtns">
    <button class="big in-color" id="inBtn">入室</button>
    <button class="big out-color" id="outBtn">退室</button>
  </div>
  <div id="homeInfo"></div>
  <div id="netInfo"></div>
</section>

<!-- 名前の一覧 -->
<section id="list" class="screen">
  <div class="bar">
    <h1 id="listHead"></h1>
    <span class="legend"><span class="o">オレンジ</span>＝入室中　黒＝退室済み</span>
    <button class="back" id="listBack">戻る</button>
  </div>
  <div id="names"></div>
</section>

<!-- 撮影 -->
<section id="cam" class="screen">
  <div id="camTitle"></div>
  <div id="camWrap"><video id="video" autoplay playsinline muted></video><div id="camFrame"></div></div>
  <div id="camMsg"></div>
  <div id="progress"><div id="progressIn"></div></div>
  <div id="camBtns">
    <button id="manualBtn" style="display:none">撮影する</button>
    <button class="back" id="camBack">やめる</button>
  </div>
</section>

<!-- 完了 -->
<section id="done" class="screen">
  <div id="doneName"></div>
  <div id="doneType"></div>
</section>

<!-- 設定（時計を5回続けてタップすると開く） -->
<section id="setup" class="screen">
  <h1 style="margin:0">設定</h1>
  <label for="gasUrl">GASのウェブアプリのURL</label>
  <input id="gasUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
  <label for="gasToken">合言葉（トークン）</label>
  <input id="gasToken" type="text" autocomplete="off">
  <div class="row">
    <button id="setupSave" class="in-color" style="color:#fff">保存して接続を確認</button>
    <button id="setupClose" class="back">閉じる</button>
  </div>
  <div id="setupMsg"></div>
</section>

<div id="modal"><div id="modalBox"><div id="modalText"></div><div id="modalBtns"></div></div></div>

<script type="module">
import { FaceLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ================================================================ 設定値
const CFG = {
  yawCenter: -5,        // 左右の向きの中心（カメラが画面の左にあるため少しずれる）
  yawTol: 15,           // 左右の許容（±度）
  pitchCenter: 0,       // 上下の向きの中心
  pitchTol: 20,         // 上下の許容（±度）
  minSize: 20,          // 顔の最小サイズ（映像の横幅に対する%）
  holdMs: 600,          // 正面をこの時間続けたら撮影
  manualAfterMs: 6000,  // この時間で撮れなければ「撮影する」ボタンを出す
  doneMs: 2500,         // 完了画面を表示する時間
  idleMs: 30000,        // 一覧・撮影画面で操作がなければ最初の画面へ戻る
  refreshMs: 60000,     // 一覧をGoogleから読み直す間隔
  retryMs: 15000,       // 送れなかった記録を再送する間隔
  photoSize: 640,       // 写真の長い辺（px）
};

const $ = id => document.getElementById(id);

// ================================================================ 端末内の保存（失敗しても動くように）
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};

let gasUrl = store.get("gasUrl", "");
let token = store.get("gasToken", "");
let employees = store.get("employees", []);   // [{id, name, kana, status:'in'|'out'}]
let queue = store.get("queue", []);           // 未送信の記録
let netError = "";

// 設定用リンク（#gas=...&token=...）で開かれたら、設定を保存してリンクを消す
(function readSetupLink() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("gas") && p.get("token")) {
    gasUrl = p.get("gas"); token = p.get("token");
    store.set("gasUrl", gasUrl); store.set("gasToken", token);
    history.replaceState(null, "", location.pathname);
  }
})();

// ================================================================ 画面の切り替え
let idleTimer = null;
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  clearTimeout(idleTimer);
  if (id === "list" || id === "cam") idleTimer = setTimeout(goHome, CFG.idleMs);
}
function touchIdle() {
  const active = document.querySelector(".screen.active");
  if (active && (active.id === "list" || active.id === "cam")) {
    clearTimeout(idleTimer); idleTimer = setTimeout(goHome, CFG.idleMs);
  }
}
document.addEventListener("pointerdown", touchIdle);

function goHome() {
  stopCapture();
  hideModal();
  renderHome();
  show("home");
}

function modal(text, buttons = [], autoCloseMs = 0) {
  $("modalText").textContent = text;
  const box = $("modalBtns"); box.innerHTML = "";
  for (const b of buttons) {
    const el = document.createElement("button");
    el.textContent = b.label; el.className = b.cls || "back";
    if (b.cls === "in-color" || b.cls === "out-color") el.style.color = "#fff";
    el.onclick = () => { hideModal(); b.onClick && b.onClick(); };
    box.appendChild(el);
  }
  $("modal").classList.add("show");
  if (autoCloseMs) setTimeout(hideModal, autoCloseMs);
}
function hideModal() { $("modal").classList.remove("show"); }

// ================================================================ 最初の画面
function tick() {
  const d = new Date();
  $("time").textContent = d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = d.toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
}
setInterval(tick, 1000); tick();

function renderHome() {
  const n = employees.filter(e => e.status === "in").length;
  $("homeInfo").textContent = employees.length ? `現在 入室中：${n}人` : "";
  const msgs = [];
  if (!gasUrl || !token) msgs.push("設定が済んでいません（時計を5回タップして設定）");
  if (netError) msgs.push(netError);
  if (queue.length) msgs.push(`未送信の記録：${queue.length}件（自動で再送します）`);
  $("netInfo").textContent = msgs.join("　／　");
}

// 時計を5回続けてタップ → 設定画面
let taps = [];
$("clock").addEventListener("click", () => {
  const now = Date.now();
  taps = taps.filter(t => now - t < 3000); taps.push(now);
  if (taps.length >= 5) { taps = []; openSetup(); }
});

$("inBtn").onclick = () => openList("in");
$("outBtn").onclick = () => openList("out");

// ================================================================ 名前の一覧
let mode = "in";
function openList(m) {
  mode = m;
  requestWakeLock();
  if (!employees.length) {
    modal(gasUrl ? "従業員の一覧を読み込めていません。\n通信を確認してください。" : "設定が済んでいません。", [{ label: "閉じる" }]);
    refreshEmployees();
    return;
  }
  $("listHead").textContent = m === "in" ? "入室：自分の名前をタップ" : "退室：自分の名前をタップ";
  $("listHead").className = m === "in" ? "in-mode" : "out-mode";
  renderNames();
  show("list");
  refreshEmployees().then(() => { if ($("list").classList.contains("active")) renderNames(); });
}

function renderNames() {
  const box = $("names"); box.innerHTML = "";
  for (const e of employees) {
    const b = document.createElement("button");
    b.className = "name" + (e.status === "in" ? " in" : "");
    b.textContent = e.name;
    b.onclick = () => pickName(e);
    box.appendChild(b);
  }
}

function pickName(e) {
  // 前回の退室を押し忘れている（入室中のまま）
  if (mode === "in" && e.status === "in") {
    modal(`${e.name} さんは\n退室の記録がありません。\n入室を記録しますか？`, [
      { label: "記録する", cls: "in-color", onClick: () => startCapture(e, "in", "退室記録なし") },
      { label: "やめる" },
    ]);
    return;
  }
  // 入室を押し忘れている
  if (mode === "out" && e.status !== "in") {
    modal(`${e.name} さんは\n入室の記録がありません。\n退室を記録しますか？`, [
      { label: "記録する", cls: "out-color", onClick: () => startCapture(e, "out", "入室記録なし") },
      { label: "やめる" },
    ]);
    return;
  }
  startCapture(e, mode, "");
}

$("listBack").onclick = goHome;

// ================================================================ 顔の向きの判定
let landmarker = null;
async function initFace() {
  try {
    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const opts = delegate => ({
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate,
      },
      runningMode: "VIDEO",
      numFaces: 1,
      minFaceDetectionConfidence: 0.3,
      minFacePresenceConfidence: 0.3,
      minTrackingConfidence: 0.3,
      outputFacialTransformationMatrixes: true,
    });
    try { landmarker = await FaceLandmarker.createFromOptions(fileset, opts("GPU")); }
    catch { landmarker = await FaceLandmarker.createFromOptions(fileset, opts("CPU")); }
  } catch (err) {
    console.error("顔判定を読み込めません", err);
  }
}

function faceAngles(m) {
  const r = (i, j) => m[j * 4 + i];
  const deg = 180 / Math.PI;
  return {
    yaw: Math.asin(Math.max(-1, Math.min(1, -r(2, 0)))) * deg,
    pitch: Math.atan2(r(2, 1), r(2, 2)) * deg,
  };
}

// ================================================================ 撮影
const video = $("video");
let stream = null;
let cap = null;   // 撮影中の情報 {emp, type, note, startedAt, okSince, running}

async function startCapture(emp, type, note) {
  const my = cap = { emp, type, note, startedAt: performance.now(), okSince: 0, running: true, lastTime: -1 };
  $("camTitle").textContent = `${emp.name} さん（${type === "in" ? "入室" : "退室"}）`;
  $("camTitle").style.color = type === "in" ? "#1f6feb" : "#374151";
  $("manualBtn").style.display = "none";
  $("progressIn").style.width = "0";
  setCamMsg("カメラを起動しています…", false);
  show("cam");
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
    });
    if (cap !== my) { s.getTracks().forEach(t => t.stop()); return; }   // 起動中に「やめる」が押された
    stream = s;
    video.srcObject = stream;
    await video.play();
  } catch (err) {
    if (cap !== my) return;
    console.error(err);
    stopCapture();
    modal("カメラを使えません（" + err.name + "）。\niPadの設定でカメラを許可してください。", [{ label: "閉じる", onClick: goHome }]);
    return;
  }
  if (cap !== my) return;
  setCamMsg(landmarker ? "カメラの方を向いてください" : "顔判定の準備中…", false);
  requestAnimationFrame(camLoop);
}

function setCamMsg(text, ok) {
  $("camMsg").textContent = text;
  $("camFrame").classList.toggle("ok", !!ok);
}

function camLoop() {
  if (!cap || !cap.running) return;
  const now = performance.now();
  if (landmarker && video.readyState >= 2 && video.currentTime !== cap.lastTime) {
    cap.lastTime = video.currentTime;
    judge(landmarker.detectForVideo(video, now), now);
  }
  if (cap && cap.running && now - cap.startedAt > CFG.manualAfterMs) $("manualBtn").style.display = "";
  if (cap && cap.running) requestAnimationFrame(camLoop);
}

function judge(res, now) {
  let ok = false, msg = "顔が見つかりません";
  if (res.faceLandmarks && res.faceLandmarks.length) {
    const xs = res.faceLandmarks[0].map(p => p.x);
    const size = (Math.max(...xs) - Math.min(...xs)) * 100;
    const { yaw, pitch } = faceAngles(res.facialTransformationMatrixes[0].data);
    if (size < CFG.minSize) msg = "もう少し近づいてください";
    else if (Math.abs(yaw - CFG.yawCenter) > CFG.yawTol || Math.abs(pitch - CFG.pitchCenter) > CFG.pitchTol) msg = "カメラの方を向いてください";
    else { ok = true; msg = "そのまま…"; }
  }
  if (ok) {
    if (!cap.okSince) cap.okSince = now;
    const p = Math.min(1, (now - cap.okSince) / CFG.holdMs);
    $("progressIn").style.width = p * 100 + "%";
    setCamMsg(msg, true);
    if (p >= 1) takePhoto("自動");
  } else {
    cap.okSince = 0;
    $("progressIn").style.width = "0";
    setCamMsg(msg, false);
  }
}

function takePhoto(method) {
  if (!cap || !cap.running || !video.videoWidth) return;
  cap.running = false;
  const scale = CFG.photoSize / Math.max(video.videoWidth, video.videoHeight);
  const c = document.createElement("canvas");
  c.width = Math.round(video.videoWidth * scale);
  c.height = Math.round(video.videoHeight * scale);
  c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
  const photo = c.toDataURL("image/jpeg", 0.7);
  const { emp, type, note } = cap;
  stopCapture();
  record(emp, type, method, note, photo);
}

function stopCapture() {
  cap = null;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
}

$("manualBtn").onclick = () => takePhoto("手動");
$("camBack").onclick = goHome;

// ================================================================ 記録（先に画面を進め、送信は裏で行う）
function record(emp, type, method, note, photo) {
  const item = {
    qid: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    id: emp.id, type, method, note, photo, time: new Date().toISOString(),
  };
  queue.push(item);
  if (!store.set("queue", queue)) {
    // 端末の保存容量が足りない時は写真を外して保存（記録だけは残す）
    store.set("queue", queue.map(q => ({ ...q, photo: q === item ? "" : q.photo })));
  }
  const e = employees.find(x => x.id === emp.id);
  if (e) e.status = type;
  store.set("employees", employees);

  $("doneName").textContent = `${emp.name} さん`;
  $("doneType").textContent = type === "in" ? "入室しました" : "退室しました";
  $("doneType").style.color = type === "in" ? "#1f6feb" : "#374151";
  show("done");
  setTimeout(() => { if ($("done").classList.contains("active")) goHome(); }, CFG.doneMs);
  sendQueue();
}

// ================================================================ Googleとの通信
async function api(body) {
  const res = await fetch(gasUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },   // この形式だとGASに直接送れる
    body: JSON.stringify({ ...body, token }),
  });
  return res.json();
}

let sending = false;
async function sendQueue() {
  if (sending || !queue.length || !gasUrl || !token) { renderHome(); return; }
  sending = true;
  try {
    while (queue.length) {
      const item = queue[0];
      let res;
      try { res = await api({ action: "punch", ...item }); }
      catch { netError = "Googleに接続できません"; break; }
      if (res.ok || res.code === "unknown_employee" || res.code === "bad_request") {
        if (!res.ok) console.warn("記録できなかったため破棄しました", res, item);
        queue.shift();
        store.set("queue", queue);
        netError = "";
      } else {
        netError = res.code === "auth" ? "合言葉（トークン）が違います" : "Google側でエラーが起きました";
        break;
      }
    }
  } finally {
    sending = false;
    renderHome();
  }
}

async function refreshEmployees() {
  if (!gasUrl || !token) { renderHome(); return; }
  try {
    const res = await api({ action: "list" });
    if (!res.ok) { netError = res.code === "auth" ? "合言葉（トークン）が違います" : "Google側でエラーが起きました"; return; }
    employees = res.employees;
    // まだ送れていない記録の分を反映
    for (const q of queue) { const e = employees.find(x => x.id === q.id); if (e) e.status = q.type; }
    store.set("employees", employees);
    netError = "";
  } catch {
    netError = "Googleに接続できません";
  } finally {
    renderHome();
  }
}

// ================================================================ 設定画面
function openSetup() {
  $("gasUrl").value = gasUrl;
  $("gasToken").value = token;
  $("setupMsg").textContent = "";
  show("setup");
}
$("setupClose").onclick = goHome;
$("setupSave").onclick = async () => {
  gasUrl = $("gasUrl").value.trim();
  token = $("gasToken").value.trim();
  store.set("gasUrl", gasUrl); store.set("gasToken", token);
  $("setupMsg").textContent = "接続を確認しています…";
  await refreshEmployees();
  $("setupMsg").textContent = netError
    ? "接続できませんでした：" + netError
    : `接続できました。従業員 ${employees.length}人を読み込みました。`;
};

// ================================================================ 画面を消さない（対応しているiPadのみ）
let wakeLock = null;
async function requestWakeLock() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch {}
}

// ================================================================ 起動
renderHome();
show(gasUrl && token ? "home" : "setup");
